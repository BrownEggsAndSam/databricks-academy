re;max-height:340px;tab-size:2}.codebox summary{cursor:pointer;padding:13px 17px;font-size:12px;color:#496a80}.result{padding:18px 20px;border-left:3px solid #71a889;border-radius:0 12px 12px 0;background:#f0f7f1;margin-top:22px}.result .eyebrow{margin:0 0 8px;font-size:9px}.result p{font-size:14px;line-height:1.7;margin:0}.checks{display:flex;flex-wrap:wrap;gap:12px;margin-top:17px}.checks label{font-size:11px;color:#52695e;display:grid;gap:6px;max-width:190px}.checks input{width:100%;max-width:180px;border:1px solid #bbcfc1;border-radius:8px;background:#fff;padding:10px 12px;color:var(--ink);font-size:14px}.feedback{font-size:12px;margin-top:12px;color:#9c492c;line-height:1.65}.feedback.ok{color:var(--green)}.taskactions{display:flex;justify-content:space-between;gap:13px;flex-wrap:wrap;margin-top:22px}.taskactions button{font-size:13px}.note{font-size:12px;line-height:1.7;color:var(--muted)}details.extra{margin-top:17px;font-size:12px;line-height:1.75;color:var(--muted)}summary{cursor:pointer;line-height:1.7}.lessonfooter{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:var(--muted)}.footer{margin-top:32px;border-top:1px solid var(--line);padding-top:18px;font-size:10px;color:var(--muted);line-height:1.8}.featuregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.featuregrid button{text-align:left;padding:20px}.featuregrid b{display:block;font-size:14px}.featuregrid small{display:block;font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}.featureicon{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:var(--soft);color:var(--green);margin-bottom:15px;font-size:18px}.notice{background:#f4f6fb;border:1px solid #dce2ed;border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.7}.notice.warn{background:#fff6e9;border-color:#ebd8b6}.field{display:grid;gap:7px;font-size:13px;margin-bottom:16px}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd9d2;border-radius:9px;background:white;color:var(--ink)}.field small{font-size:11px;color:var(--muted);line-height:1.6}.checklabel{display:flex;align-items:center;gap:9px;font-size:13px;margin:18px 0}.checklabel input{accent-color:var(--green)}dialog{width:calc(100% - 30px);max-width:660px;padding:0;border:1px solid var(--line);border-radius:21px;color:var(--ink);background:white;max-height:90dvh;box-shadow:0 22px 90px #24433123}dialog::backdrop{background:#4f625866}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 25px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:1}.dialoghead h2{font-size:21px;margin:0}.dialogbody{padding:25px}.dialogbody p,.dialogbody li{font-size:14px}.dialogbody pre{white-space:pre-wrap;font-size:12px;line-height:1.8;background:#f5f8f6;padding:17px;border:1px solid var(--line);border-radius:11px;overflow-wrap:anywhere}.toast{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);z-index:20;background:#fff;border:1px solid #bbd4c6;box-shadow:0 5px 30px #29493615;border-radius:12px;padding:15px 22px;font-size:13px;max-width:90vw}.hidden{display:none!important}.skip{position:absolute;top:-100px;z-index:50;background:white;padding:20px}.skip:focus{top:5px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.step-done{background:#eaf5ed;border:1px solid #bedfc9;padding:10px 14px;border-radius:9px;font-size:12px;color:#296844}.jump{margin-bottom:20px}

</style></head><body><a class="skip" href="#main">Skip to sandbox guide</a><header class="topbar"><button class="brand" data-go="week" aria-label="Academy home"><span aria-hidden="true">◈</span><span>Databricks Academy<small>One-week sandbox sprint</small></span></button><div class="row"><a class="small tracklink" href="./governance-labs.html">Governance labs →</a><button class="small" data-go="features">Feature map</button><button class="small" data-action="settings">My sandbox</button><button class="small" data-action="travel">Save & move</button></div></header><div class="shell"><aside class="rail"><div class="eyebrow">Your seven-day route</div><nav id="weeknav" aria-label="Daily sandbox sessions"></nav><div class="railbottom"><b class="micro" id="progress">0/28 checkpoints</b><div class="meter" aria-hidden="true"><span id="meter"></span></div><div class="micro muted" id="save-status"></div><div class="micro muted" id="blocked-count"></div><p class="space"><button class="text" data-go="week">Week overview →</button></p><a href="https://browneggsandsam.github.io/databricks-academy/deep-dive.html" target="_blank" rel="noopener">Optional deep reference ↗</a></div></aside><main class="main" id="main" tabindex="-1"></main></div><noscript><p style="padding:30px">Open this guide in a browser with JavaScript enabled. The exercises run in your Databricks workspace.</p></noscript><dialog id="dialog" aria-labelledby="dialog-title"><div class="dialoghead"><h2 id="dialog-title"></h2><button class="small" id="close" data-action="close">Close ×</button></div><div class="dialogbody" id="dialog-body"></div></dialog><div class="toast hidden" id="toast" role="status" aria-live="polite"></div><input class="hidden" id="import-file" type="file" accept=".json,application/json" aria-label="Import week progress"><script type="application/json" id="sprint-data">{"days":[{"id":1,"title":"Make the sandbox yours","time":"45–60 min","feature":"SQL warehouse + Delta table","win":"A table you created and can find again.","steps":[{"id":"1-1","title":"Run your first query","where":"Databricks → SQL → SQL editor","do":["Create a query. Select your vendor-approved SQL warehouse near the top.","Copy and run this SQL. Run statements individually if needed to inspect each result.","Choose an approved sandbox catalog from the list; avoid hive_metastore for this guide."],"look":"Your user name and at least one approved catalog.","why":"The editor is where you write; the warehouse is what runs the SQL.","code":"connect","check":[],"help":"No warehouse? Ask for CAN USE on an approved SQL warehouse. No catalog? Ask the sandbox owner for the approved Unity Catalog location.","extra":"","action":null,"refs":["sql"]},{"id":"1-2","title":"Choose where your practice lives","where":"This guide → Sandbox settings","do":["Enter your approved catalog and personal schema in Sandbox settings.","Already given a writable schema? Select “Use existing schema.” In a shared schema, choose a unique table prefix.","Save settings. Run the SQL below only if you are creating your own schema."],"look":"Your chosen schema appears under its catalog.","why":"Catalog → schema → table is an address, like folders inside folders.","code":"schema","check":[],"help":"CREATE SCHEMA needs permission on the catalog. Otherwise use a writable schema supplied by the owner. Managed storage must already be configured.","extra":"","action":"settings","refs":["schema","table"]},{"id":"1-3","title":"Create 12 fake loans","where":"SQL editor → new query","do":["Run this block in your chosen lab namespace.","The four deliberate defects are part of the exercise.","Save the query as “Week 1 — seed loans.”"],"look":"rows_created = 12.","why":"A Delta table stores records so they survive closing a query.","code":"seed","check":[["rows_created",12]],"help":"IF NOT EXISTS does not reseed an existing table. If it contains different data, choose a fresh personal schema or prefix. Do not overwrite an unfamiliar table.","extra":"Synthetic data only; no customer data or cloud credentials needed.","action":null,"refs":["delta"]},{"id":"1-4","title":"Find your table again","where":"Databricks → Catalog","do":["Expand your catalog and schema; open the raw-loans table.","Inspect its columns and Sample Data. Or run the query below.","Find L009 through L012. Tomorrow you will investigate them."],"look":"12 rows; columns loan_id, balance, state and status.","why":"Catalog Explorer maps registered assets; it is not a scan of every S3 file.","code":"browse","check":[],"help":"Refresh the tree and search the full table name. A missing result can mean wrong scope or missing access.","extra":"","action":null,"refs":["table"]}]},{"id":2,"title":"Find the four defects","time":"40–50 min","feature":"SQL profiling","win":"A short profile with numbers you can defend.","steps":[{"id":"2-1","title":"Count what is there","where":"SQL editor","do":["Run this profile on your raw table.","Compare total_rows with balances_present. Which row explains the difference?"],"look":"12 rows · 12 unique loans · 11 balances present · 1 missing balance.","why":"COUNT(*) counts rows; COUNT(balance) skips null balances.","code":"profile","check":[["total_rows",12],["missing_balances",1]],"help":"If counts differ, check the table name and whether the Day 7 mutation has already been applied.","extra":"","action":null,"refs":["sql"]},{"id":"2-2","title":"Pull the exception list","where":"SQL editor","do":["Run the filter and inspect each returned row.","Lab rules: balance is present and nonnegative; state is VA/FL/NJ; status is Current/Delinquent/Paid."],"look":"L009: null · L010: negative · L011: ZZ · L012: Unknown.","why":"A rule makes “bad data” specific and testable.","code":"findbad","check":[["exception_rows",4]],"help":"Check the source table and the exact filters.","extra":"These are sample rules for this portfolio, not universal lending rules.","action":null,"refs":["sql"]},{"id":"2-3","title":"Group the data","where":"SQL editor → results","do":["Run the grouped query and save it as “Week 1 — state profile.”","If chart controls are available, add a bar chart: state on X, loan_count on Y."],"look":"VA 5 · FL 3 · NJ 3 · ZZ 1.","why":"Grouping exposes unexpected categories quickly.","code":"group","check":[],"help":"A result table is enough. Editor chart controls vary; Day 5 covers dashboards.","extra":"","action":null,"refs":["sql"]},{"id":"2-4","title":"Explain the result in one sentence","where":"Your saved queries","do":["Reopen your saved profile and exception query.","Say: “Four of twelve loans fail at least one of these three checks.”","Name one thing you have not checked, such as source completeness."],"look":"You can find the queries and explain their scope.","why":"A result needs a denominator and a boundary.","code":null,"check":[],"help":"Return to the previous two queries and count the rows.","extra":"No essay required. Your saved queries are the evidence.","action":null,"refs":[]}]},{"id":3,"title":"Build reusable views","time":"45–60 min","feature":"Views + a quality scorecard","win":"Accepted loans, exceptions and a reusable score.","steps":[{"id":"3-1","title":"Give each row a result","where":"SQL editor","do":["Create the checked view, then run its SELECT.","Find the eight PASS rows and four failure reasons."],"look":"8 PASS rows; 4 exceptions.","why":"A view saves a query; it does not copy the data.","code":"checked","check":[["pass_rows",8]],"help":"Run Day 1 first and verify the same catalog, schema and prefix.","extra":"The CASE reports the first failure per row. This is custom SQL, not managed quality monitoring.","action":null,"refs":["view"]},{"id":"3-2","title":"Separate usable rows and exceptions","where":"SQL editor","do":["Create the accepted and exception views.","Run the combined count query. Keep exceptions available for investigation."],"look":"accepted = 8; exceptions = 4.","why":"Different consumers need different views of the checked data.","code":"split","check":[["accepted",8],["exceptions",4]],"help":"Create the checked view in the previous step first.","extra":"","action":null,"refs":["view"]},{"id":"3-3","title":"Create one shared score","where":"SQL editor","do":["Run the scorecard definition.","Read pass_pct as 8 ÷ 12 × 100, rounded to one decimal."],"look":"12 assessed · 8 accepted · 4 rejected · 66.7 pass_pct.","why":"A shared calculation keeps dashboards on the same denominator.","code":"score","check":[["pass_pct",66.7]],"help":"If the score differs, inspect the checked view before changing the formula.","extra":"","action":null,"refs":["view"]},{"id":"3-4","title":"Check a business number","where":"SQL editor","do":["Sum balances from accepted loans only.","Explain why summing the raw table would answer a different question."],"look":"accepted_balance = 1,715,000.","why":"The population behind a metric matters as much as the SQL.","code":"balance","check":[["accepted_balance",1715000]],"help":"Confirm you queried the accepted view, not the raw table.","extra":"","action":null,"refs":[]}]},{"id":4,"title":"Use the catalog like a steward","time":"45–60 min","feature":"Comments, inventory + lineage","win":"A documented asset and a Collibra mapping draft.","steps":[{"id":"4-1","title":"Document the table and a column","where":"SQL editor → Catalog","do":["Run these comments on your raw table.","Refresh Catalog Explorer; read the description and balance column comment."],"look":"Both descriptions appear with the asset.","why":"Descriptions explain meaning where people use the data.","code":"comment","check":[],"help":"Use the SQL warehouse. Commenting on the table requires MODIFY; you should have it on the table you own.","extra":"A comment neither masks data nor approves an enterprise glossary term.","action":null,"refs":["comment"]},{"id":"4-2","title":"List your registered assets","where":"SQL editor","do":["Run this metadata query.","Find the raw table and four views; inspect their types and owners."],"look":"5 lab assets: 1 table + 4 views.","why":"Information schema turns catalog metadata into a report.","code":"inventory","check":[["lab_assets",5]],"help":"Results are privilege-filtered. They do not inventory all S3 files or all company datasets.","extra":"","action":null,"refs":["inventory"]},{"id":"4-3","title":"Follow the score upstream","where":"Catalog → scorecard → Lineage","do":["Run the scorecard SELECT below to exercise the dependency.","Open Lineage, then expand the graph toward the checked view and raw table.","Inspect an edge or column if available."],"look":"Raw table → checked view → scorecard.","why":"Lineage helps trace a result and assess a change.","code":"dashboard_score","check":[],"help":"Refresh, allow a capture delay and widen the time range. Unity Catalog and suitable permissions are required. Mark blocked if unavailable; SQL definitions still show intended dependencies.","extra":"","action":null,"refs":["lineage"]},{"id":"4-4","title":"Make the Collibra connection","where":"This guide → mapping draft","do":["Download the draft mapping for the balance column.","Review the technical name, proposed term, definition and draft status.","Identify who would approve that term in your team."],"look":"One technical column mapped to a proposed business definition.","why":"Technical evidence supports your governance approval process.","code":null,"check":[],"help":"This is a draft CSV. It does not connect to or change Collibra.","extra":"Validate the company connector and which system owns each attribute before syncing.","action":"mapping","refs":["collibra"]}]},{"id":5,"title":"Build a dashboard","time":"45–60 min","feature":"AI/BI Dashboards","win":"A quality score with the rows behind it.","steps":[{"id":"5-1","title":"Add a scorecard dataset","where":"Databricks → Dashboards → Create dashboard","do":["Name it “Week 1 — Loan quality”; select your approved SQL warehouse.","Open Data, create a dataset from SQL, and paste this query.","Run it and name the dataset “Quality summary.”"],"look":"One row: 12 assessed, 8 accepted, 4 rejected, 66.7 pass_pct.","why":"Dashboard datasets supply the results used by widgets.","code":"dashboard_score","check":[],"help":"Look for Create from SQL or a dataset editor; labels vary. If Dashboards is unavailable, keep the saved query and mark blocked.","extra":"","action":null,"refs":["dashboard"]},{"id":"5-2","title":"Make a clear headline","where":"Dashboard → Canvas","do":["Add a counter using Quality summary; select pass_pct.","Title it “Loans passing checks (%)” and show one decimal.","Optionally add a second counter for rejected."],"look":"The headline reads 66.7.","why":"SQL already multiplied by 100. Use a regular number format.","code":null,"check":[],"help":"If a percent formatter shows 6,670%, switch to number formatting. A simple table showing pass_pct also works.","extra":"","action":null,"refs":["dashboard"]},{"id":"5-3","title":"Show the exceptions","where":"Dashboard → Data, then Canvas","do":["Add this second SQL dataset.","Create a table widget with loan_id, quality_result, balance and state.","Keep your personal dashboard as a draft for this exercise."],"look":"4 exception rows, each with a reason.","why":"The score invites a question; the rows give someone an action.","code":"dashboard_exceptions","check":[],"help":"Verify that the widget uses the exception dataset, not Quality summary.","extra":"","action":null,"refs":["dashboard"]},{"id":"5-4","title":"Test the numbers","where":"Dashboard → run / refresh datasets","do":["Refresh both datasets and compare them with your SQL results.","Open each dataset and point to its source view.","Leave publishing and sharing for an approved team review later."],"look":"Every displayed number agrees with its query.","why":"Saved layout, refreshed data and shared access are separate concerns.","code":null,"check":[],"help":"Rerun the dataset, verify its query and warehouse, then inspect the visual’s aggregation and filters.","extra":"","action":null,"refs":["dashboard"]}]},{"id":6,"title":"Make a repeatable refresh","time":"50–70 min","feature":"Lakeflow Jobs + a snapshot","win":"Two successful runs and a one-row snapshot.","steps":[{"id":"6-1","title":"Save a snapshot query","where":"SQL editor","do":["Run this once and save it as “Week 1 — capture quality.”","Find the new snapshot table in Catalog."],"look":"A stored quality result with captured_at.","why":"A table stores a result; an ordinary view computes it when queried.","code":"snapshot","check":[],"help":"The source scorecard view must exist first.","extra":"This replaces only your named lab snapshot. It keeps the latest result, not daily history.","action":null,"refs":["delta"]},{"id":"6-2","title":"Run it as a job","where":"Jobs & Pipelines → Create job","do":["Add a SQL task; choose Query and your saved snapshot query.","Use an approved pro or serverless SQL warehouse. Check the run-as identity’s access.","Save, click Run now, and open the task details. Leave scheduling off."],"look":"The SQL task finishes successfully.","why":"Jobs add controlled execution and a record of each run.","code":null,"check":[],"help":"SQL tasks need pro/serverless SQL compute and permissions. If blocked, run the query manually, mark this step blocked, and continue. Manual execution is not a job demonstration.","extra":"","action":null,"refs":["jobs"]},{"id":"6-3","title":"Check a second run","where":"Job → Run now, then SQL editor","do":["Run the job again, or rerun the saved query if job access was blocked.","Inspect captured_at and count the stored rows."],"look":"1 snapshot row; pass_pct 66.7; a later captured_at.","why":"Replacing a snapshot can be rerun without appending duplicates.","code":"snapshot_check","check":[["snapshot_rows",1]],"help":"Check task status and refresh the SELECT. A failed job does not update captured_at.","extra":"","action":null,"refs":["jobs"]},{"id":"6-4","title":"Explore the controls","where":"Job → Runs and schedule settings","do":["Inspect duration, task status and both run records.","Find schedule, time-zone and pause controls. Leave scheduling off.","Say who would investigate a failed refresh in your team."],"look":"You can find runs and describe the next action after a failure.","why":"Automation needs an owner as well as a schedule.","code":null,"check":[],"help":"If Jobs is unavailable, mark blocked and keep the manual refresh. Ask the owner about the approved capability.","extra":"","action":null,"refs":["jobs"]}]},{"id":7,"title":"Break it, trace it, fix it","time":"50–70 min","feature":"A small incident you can explain","win":"A three-minute working demo for your team.","steps":[{"id":"7-1","title":"Predict one bad update","where":"This guide → prediction","do":["Start with the original 8 passing loans out of 12.","If one passing loan becomes invalid, what will pass_pct be?"],"look":"7 ÷ 12 × 100 = 58.3%, rounded.","why":"Predicting the output tests your understanding before execution.","code":null,"check":[["predicted_pass_pct",58.3]],"help":"You still have 12 loans; only the number passing decreases.","extra":"If already changed, restore L001 to 250000 and recapture the snapshot at 66.7 before starting.","action":null,"refs":[]},{"id":"7-2","title":"Break one synthetic loan","where":"SQL editor","do":["Run this update to the lab’s L001.","Compare the live score with the stored snapshot; do not refresh the snapshot yet.","Refresh dashboard datasets and find the fifth exception."],"look":"Live: 7 accepted, 5 rejected, 58.3%. Snapshot: its earlier score.","why":"A live view and a stored snapshot can disagree until a refresh.","code":"break","check":[["accepted",7],["rejected",5],["pass_pct",58.3]],"help":"Snapshot missing? Finish Day 6. Already 58.3? Check whether a manual run or schedule refreshed it.","extra":"","action":null,"refs":["delta"]},{"id":"7-3","title":"Refresh the stored result","where":"Job → Run now; then SQL editor","do":["Run the snapshot job; use the saved capture query if Jobs was blocked.","Read the snapshot again and compare with the live score."],"look":"Snapshot now shows 58.3 and a later captured_at.","why":"Check a successful run against its output, not only its status.","code":"snapshot_check","check":[["snapshot_pass_pct",58.3]],"help":"Verify the job ran the capture query against the same namespace.","extra":"","action":null,"refs":["jobs"]},{"id":"7-4","title":"Repair it and show your work","where":"SQL editor → dashboard → run history","do":["Restore L001 with this SQL; rerun snapshot capture and refresh the dashboard.","Demo: 12 rows → 4 exceptions → 66.7% → catalog description → refresh run.","Download the demo card. Choose one approved team dataset for a later pilot."],"look":"Live score and refreshed snapshot return to 66.7%.","why":"You can now navigate, explain, operate and improve a small workflow.","code":"repair","check":[["restored_pass_pct",66.7]],"help":"The repair changes the raw table. Rerun the job or saved capture query separately to refresh the snapshot.","extra":"Next: a reviewed team pilot. Wider expertise and certification require more varied practice.","action":"demo","refs":["history"]}]}],"sql":{"connect":"SELECT current_user() AS learner, current_catalog() AS catalog, current_schema() AS schema;\nSHOW CATALOGS;","schema":"CREATE SCHEMA IF NOT EXISTS {{NS}};","seed":"CREATE TABLE IF NOT EXISTS {{RAW}}\nUSING DELTA AS\nSELECT CAST(loan_id AS STRING) AS loan_id,\n       CAST(balance AS DECIMAL(12,2)) AS balance,\n       CAST(state AS STRING) AS state,\n       CAST(status AS STRING) AS status\nFROM VALUES\n ('L001',250000,'VA','Current'),\n ('L002',180000,'FL','Current'),\n ('L003',300000,'VA','Delinquent'),\n ('L004',125000,'NJ','Current'),\n ('L005',0,'NJ','Paid'),\n ('L006',150000,'FL','Current'),\n ('L007',210000,'VA','Delinquent'),\n ('L008',500000,'VA','Current'),\n ('L009',NULL,'VA','Current'),\n ('L010',-500,'FL','Current'),\n ('L011',100000,'ZZ','Current'),\n ('L012',75000,'NJ','Unknown')\nAS v(loan_id,balance,state,status);\n\nSELECT COUNT(*) AS rows_created FROM {{RAW}};","browse":"SELECT * FROM {{RAW}} ORDER BY loan_id;","profile":"SELECT COUNT(*) AS total_rows,\n       COUNT(DISTINCT loan_id) AS unique_loans,\n       COUNT(balance) AS balances_present,\n       SUM(CASE WHEN balance IS NULL THEN 1 ELSE 0 END) AS missing_balances\nFROM {{RAW}};","findbad":"SELECT * FROM {{RAW}}\nWHERE balance IS NULL OR balance < 0\n   OR state IS NULL OR state NOT IN ('VA','FL','NJ')\n   OR status IS NULL OR status NOT IN ('Current','Delinquent','Paid')\nORDER BY loan_id;","group":"SELECT state, COUNT(*) AS loan_count FROM {{RAW}}\nGROUP BY state ORDER BY loan_count DESC, state;","checked":"CREATE OR REPLACE VIEW {{CHECKED}} AS\nSELECT *,\n  CASE\n    WHEN balance IS NULL THEN 'Missing balance'\n    WHEN balance < 0 THEN 'Negative balance'\n    WHEN state IS NULL OR state NOT IN ('VA','FL','NJ') THEN 'Invalid state'\n    WHEN status IS NULL OR status NOT IN ('Current','Delinquent','Paid') THEN 'Invalid status'\n    ELSE 'PASS'\n  END AS quality_result\nFROM {{RAW}};\n\nSELECT loan_id, quality_result FROM {{CHECKED}} ORDER BY loan_id;","split":"CREATE OR REPLACE VIEW {{ACCEPTED}} AS\nSELECT loan_id, balance, state, status FROM {{CHECKED}}\nWHERE quality_result = 'PASS';\n\nCREATE OR REPLACE VIEW {{EXCEPTIONS}} AS\nSELECT * FROM {{CHECKED}} WHERE quality_result <> 'PASS';\n\nSELECT 'accepted' AS result, COUNT(*) AS row_count FROM {{ACCEPTED}}\nUNION ALL\nSELECT 'exceptions', COUNT(*) FROM {{EXCEPTIONS}};","score":"CREATE OR REPLACE VIEW {{SCORE}} AS\nSELECT COUNT(*) AS assessed,\n       SUM(CASE WHEN quality_result = 'PASS' THEN 1 ELSE 0 END) AS accepted,\n       SUM(CASE WHEN quality_result <> 'PASS' THEN 1 ELSE 0 END) AS rejected,\n       ROUND(100.0 * SUM(CASE WHEN quality_result = 'PASS' THEN 1 ELSE 0 END)\n             / NULLIF(COUNT(*), 0), 1) AS pass_pct\nFROM {{CHECKED}};\n\nSELECT * FROM {{SCORE}};","balance":"SELECT SUM(balance) AS accepted_balance FROM {{ACCEPTED}};","comment":"COMMENT ON TABLE {{RAW}}\nIS 'Synthetic learning data. One row per loan. Not a production data source.';\n\nCOMMENT ON COLUMN {{RAW}}.balance\nIS 'Outstanding principal in USD for this exercise. Must be present and nonnegative.';","inventory":"SELECT table_name, table_type, table_owner, comment\nFROM {{CAT}}.information_schema.tables\nWHERE LOWER(table_schema) = LOWER('{{SCHEMA_TEXT}}')\n  AND LOWER(table_name) IN ({{TABLE_NAMES}})\nORDER BY table_name;","dashboard_score":"SELECT assessed, accepted, rejected, pass_pct FROM {{SCORE}};","dashboard_exceptions":"SELECT loan_id, balance, state, status, quality_result\nFROM {{EXCEPTIONS}} ORDER BY loan_id;","snapshot":"CREATE OR REPLACE TABLE {{SNAPSHOT}}\nUSING DELTA AS\nSELECT current_timestamp() AS captured_at, * FROM {{SCORE}};","snapshot_check":"SELECT * FROM {{SNAPSHOT}};\nSELECT COUNT(*) AS snapshot_rows FROM {{SNAPSHOT}};","break":"-- Only change the synthetic loan created by this guide.\nUPDATE {{RAW}} SET balance = -100 WHERE loan_id = 'L001';\nSELECT * FROM {{SCORE}};\nSELECT * FROM {{SNAPSHOT}};","repair":"UPDATE {{RAW}} SET balance = 250000 WHERE loan_id = 'L001';\nSELECT * FROM {{SCORE}};","history":"DESCRIBE HISTORY {{RAW}};"},"sources":{"sql":["SQL editor","https://docs.databricks.com/aws/en/sql/user/sql-editor/write-queries"],"table":["Table creation and privileges","https://docs.databricks.com/aws/en/getting-started/create-table"],"schema":["Create a schema","https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-schema"],"delta":["Create a Delta table","https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-table-using"],"view":["Create a view","https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-view"],"comment":["Table and column comments","https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-comment"],"lineage":["Unity Catalog lineage","https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage"],"dashboard":["Create a dashboard","https://docs.databricks.com/aws/en/dashboards/tutorials/create-dashboard"],"jobs":["SQL tasks in Jobs","https://docs.databricks.com/aws/en/jobs/tasks/sql"],"inventory":["Information schema","https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-information-schema"],"history":["Table history","https://docs.databricks.com/aws/en/tables/history"],"collibra":["Collibra and Unity Catalog","https://productresources.collibra.com/docs/collibra/latest/Content/Catalog/Databricks/co_about-databricks-integration.htm"]},"checked":"11 October 2026","features":[["Catalog / Unity Catalog","Find and govern assets","Inspect columns, descriptions, owners, access and lineage. It does not automatically inventory every unregistered S3 file.","4-1","◇"],["SQL warehouse","Execute your queries","Compute that runs SQL. Use an approved warehouse with suitable permissions; running compute can incur cost.","1-1","⚡"],["Delta table","Store your data","Keeps records and transaction history. History is not a substitute for backups or retained data files.","1-3","▤"],["View","Reuse a query","A named SELECT over other data. An ordinary view does not store a refreshed copy.","3-1","◫"],["SQL editor","Investigate data","Write, run and save queries. Correct syntax still needs the right business rule and denominator.","2-1","⌘"],["Dashboards","Communicate results","Build visuals over query results. Data refresh and sharing access are separate choices.","5-1","▥"],["Lakeflow Jobs","Repeat work reliably","Runs tasks and records outcomes. Check the resulting data as well as the green task status.","6-2","↻"],["Collibra + Databricks","Join meaning to evidence","Use the approved integration and agreed attribute ownership. This week produces a mapping draft only.","4-4","⇄"]]}</script><script>
'use strict';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DATA=JSON.parse($('#sprint-data').textContent),DAYS=DATA.days,STEPS=DAYS.flatMap(d=>d.steps),KEY='databricks-sandbox-week-v1',OLD='https://browneggsandsam.github.io/databricks-academy/deep-dive.html';
const ID=/^[A-Za-z_][A-Za-z0-9_-]{0,100}$/,PREFIX=/^[A-Za-z][A-Za-z0-9_]{0,35}$/;
function clean(p){const x={catalog:'',schema:'academy_sam_week',prefix:'sam_w1',existing:false,progress:{},answers:{},reasons:{},last:'1-1'};if(!p||typeof p!=='object')return x;for(const k of ['catalog','schema'])if(typeof p[k]==='string'&&ID.test(p[k]))x[k]=p[k];if(typeof p.prefix==='string'&&PREFIX.test(p.prefix))x.prefix=p.prefix;x.existing=p.existing===true;x.last=STEPS.some(s=>s.id===p.last)?p.last:'1-1';for(const s of STEPS){if(['done','blocked'].includes(p.progress?.[s.id]))x.progress[s.id]=p.progress[s.id];if(Array.isArray(p.answers?.[s.id]))x.answers[s.id]=p.answers[s.id].slice(0,s.check.length).map(v=>String(v).slice(0,32));if(typeof p.reasons?.[s.id]==='string')x.reasons[s.id]=p.reasons[s.id].slice(0,150);}return x;}
let state=clean(null),saved=true,page='week',focusBack,pendingImport,toastTimer;
try{state=clean(JSON.parse(localStorage.getItem(KEY)||'null'));}catch{saved=false;}
function ready(){return ID.test(state.catalog)&&!['hive_metastore','system','samples'].includes(state.catalog.toLowerCase())&&ID.test(state.schema)&&PREFIX.test(state.prefix);}
function ident(x){return String.fromCharCode(96)+x+String.fromCharCode(96);}
function names(){const cat=ready()?state.catalog:'YOUR_CATALOG',schema=state.schema,p=state.prefix+'_',ns=ident(cat)+'.'+ident(schema);return {NS:ns,CAT:ident(cat),SCHEMA_TEXT:schema,RAW:ns+'.'+ident(p+'loans_raw'),CHECKED:ns+'.'+ident(p+'loans_checked'),ACCEPTED:ns+'.'+ident(p+'loans_accepted'),EXCEPTIONS:ns+'.'+ident(p+'loan_exceptions'),SCORE:ns+'.'+ident(p+'quality_scorecard'),SNAPSHOT:ns+'.'+ident(p+'quality_snapshot'),TABLE_NAMES:['loans_raw','loans_checked','loans_accepted','loan_exceptions','quality_scorecard'].map(n=>"'"+p.toLowerCase()+n+"'").join(', ')};}
function sql(key){if(key==='schema'&&state.existing)return '-- Use the existing schema supplied by your sandbox owner.\n-- No CREATE SCHEMA statement is needed.';const n=names();return DATA.sql[key].replace(/\{\{([A-Z_]+)\}\}/g,(_,k)=>n[k]);}
function done(){return Object.values(state.progress).filter(x=>x==='done').length;}
function blocked(){return Object.values(state.progress).filter(x=>x==='blocked').length;}
function dayDone(d){return d.steps.every(s=>state.progress[s.id]==='done');}
function nextOpen(){return STEPS.find(s=>!state.progress[s.id])||STEPS.find(s=>state.progress[s.id]!=='done')||STEPS[0];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saved=true;}catch{saved=false;}chrome();}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4000);}
function chrome(){$('#weeknav').innerHTML=DAYS.map(d=>{const active=page.startsWith(d.id+'-'),n=d.steps.filter(s=>state.progress[s.id]==='done').length,b=d.steps.some(s=>state.progress[s.id]==='blocked');return '<button class="daybutton '+(active?'active':'')+'" data-day="'+d.id+'" '+(active?'aria-current="step"':'')+'><span class="stamp '+(dayDone(d)?'done':b?'blocked':'')+'">'+(dayDone(d)?'✓':d.id)+'</span><span><b>Day '+d.id+'</b><small>'+d.title+' · '+n+'/4</small></span></button>';}).join('');$('#progress').textContent=done()+'/28 checkpoints';$('#meter').style.width=done()/28*100+'%';$('#save-status').textContent=saved?'Saved in this browser':'Saving unavailable · export a backup';$('#blocked-count').textContent=blocked()?blocked()+' blocked · return when access is ready':'';}
function go(id){page=['week','features'].includes(id)||STEPS.some(s=>s.id===id)?id:'week';if(STEPS.some(s=>s.id===page))state.last=page;history.replaceState(null,'','#'+page);save();render();window.scrollTo({top:0,behavior:'instant'});$('#main').focus();}
function render(){chrome();$('#main').innerHTML=(page==='week'?home():page==='features'?featureMap():lesson(STEPS.find(s=>s.id===page)))+'<footer class="footer">This guide does not connect to your workspace. Paste code into Databricks and verify the result yourself.<br>Independent learning companion · synthetic data · instructions checked '+DATA.checked+'. <a href="'+OLD+'" target="_blank" rel="noopener">Optional deep reference ↗</a></footer>';}
function home(){return '<section class="hero"><div><div class="eyebrow">7 days · about 6–7 hours · your sandbox</div><h1>Less reading.<br>More Databricks.</h1><p>Build one working loan-quality dashboard from an empty sandbox. Keep this guide beside Databricks and follow one small action at a time.</p><p class="micro space"><a href="./governance-labs.html"><b>New: Governance Labs →</b></a> Inventory, lineage, access and Collibra validation.</p><div class="row space"><button class="primary" data-go="'+nextOpen().id+'">'+(done()?'Continue my next step':'Start Day 1')+' →</button><button data-go="features">What does each tool do?</button></div><p class="micro space">The goal this week: confidently build and explain a small workflow. Expertise grows through more varied projects.</p></div><div class="preview" aria-label="Expected baseline from the synthetic lab"><div class="row between"><span class="preview-label">Your lab’s starting result</span><span class="pill">Synthetic</span></div><div class="score">66.7<span style="font-size:28px">%</span></div><p class="micro muted">8 of 12 loans pass your checks</p><div class="minirow"><b>L009</b><span>Missing balance</span></div><div class="minirow"><b>L010</b><span>Negative balance</span></div><div class="minirow"><b>L011</b><span>Invalid state</span></div><div class="minirow"><b>L012</b><span>Invalid status</span></div></div></section><div class="grid2 space"><section class="card"><div class="eyebrow">Before you start</div><h3>Open your company sandbox in another tab.</h3><p class="micro muted">You need an approved SQL warehouse and a writable Unity Catalog schema. The guide creates the practice data.</p><button class="text space" data-action="settings">Set my sandbox names →</button></section><section class="card"><div class="eyebrow">How each step works</div><h3>Do it → look at the result → move on.</h3><p class="micro muted">Use “I’m stuck” for help or missing access. No essays or reading points. A day earns its checkmark when all four checkpoints are done.</p></section></div><div class="sectionhead"><h2>Your week, at a glance</h2><p class="micro muted">45–70 minutes a day. All days stay open.</p></div><div class="roadmap">'+DAYS.map(d=>'<button data-day="'+d.id+'"><span>'+String(d.id).padStart(2,'0')+'</span><div><b>'+d.title+'</b><small>'+d.win+'</small></div></button>').join('')+'</div>';}
function codeBox(key){const configured=ready()||key==='connect',long=sql(key).split('\n').length>16,body='<pre id="sql-code"><code>'+esc(sql(key))+'</code></pre>';return '<div class="codebox"><div class="codehead"><span>Run in Databricks · SQL</span><div class="row"><button class="small" data-code="'+key+'" '+(!configured?'disabled':'')+'>Copy SQL</button><button class="small" data-download-code="'+key+'" '+(!configured?'disabled':'')+'>Download .sql</button></div></div>'+(!configured?'<div class="notice warn">First <button class="text" data-action="settings">set your catalog and schema</button> so this code points to your lab.</div>':'')+(long?'<details><summary>Show SQL · '+sql(key).split('\n').length+' lines</summary>'+body+'</details>':body)+'</div>';}
function lesson(s){const d=DAYS.find(x=>x.steps.some(t=>t.id===s.id)),index=d.steps.indexOf(s),status=state.progress[s.id];return '<section class="lessonhead"><div class="row between"><span class="eyebrow">Day '+d.id+' · '+d.time+'</span><button class="text" data-go="week">Week overview ↗</button></div><h1>'+d.title+'</h1><p>'+d.feature+' · '+d.win+'</p></section><nav class="steps" aria-label="Day '+d.id+' steps">'+d.steps.map((x,i)=>'<button class="'+(x.id===s.id?'active':'')+' '+(state.progress[x.id]==='done'?'finished':'')+'" data-go="'+x.id+'" aria-pressed="'+(x.id===s.id)+'">'+(state.progress[x.id]==='done'?'✓ ':state.progress[x.id]==='blocked'?'! ':'')+'Step '+(i+1)+'</button>').join('')+'</nav><article class="task"><div class="tasktop"><span class="where">'+s.where+'</span><h2>'+s.title+'</h2><ol class="instructions">'+s.do.map(t=>'<li>'+t+'</li>').join('')+'</ol></div><div class="taskbody"><div class="why"><b>Why:</b> '+s.why+'</div>'+(s.action?'<div class="row"><button class="soft" data-action="'+s.action+'">'+({settings:'Set my sandbox names',mapping:'Download mapping draft',demo:'Download 3-minute demo card'})[s.action]+' ↗</button></div>':'')+(s.code?codeBox(s.code):'')+(s.id==='7-1'?'<details class="space"><summary>Reveal the expected result after predicting</summary>':'')+'<div class="result"><div class="eyebrow">Look for this</div><p>'+s.look+'</p></div>'+(s.id==='7-1'?'</details>':'')+(s.check.length?'<div class="checks">'+s.check.map(([label],i)=>'<label>'+esc(label)+' — what did you see?<input data-answer="'+i+'" aria-label="'+esc(label)+' observed value" inputmode="decimal" value="'+esc(state.answers[s.id]?.[i]||'')+'" placeholder="Enter your result"></label>').join('')+'</div>':'')+'<div id="feedback" class="feedback" role="status"></div>'+(status?'<div class="step-done '+(status==='blocked'?'amber':'')+'">'+(status==='done'?'✓ Checkpoint recorded':'! Blocked: '+esc(state.reasons[s.id]||'access or setup'))+' <button class="text" data-action="undo">Undo</button></div>':'')+'<div class="taskactions"><button data-action="help">I’m stuck</button><button class="primary" data-action="complete">'+(status==='done'?'Next step →':s.check.length?'Check my result & continue →':'I can see it — continue →')+'</button></div>'+((s.extra||s.refs.length)?'<details class="extra"><summary>Only if you want more detail</summary>'+(s.extra?'<p>'+s.extra+'</p>':'')+s.refs.map(k=>'<p><a href="'+DATA.sources[k][1]+'" target="_blank" rel="noopener noreferrer">'+DATA.sources[k][0]+' ↗</a></p>').join('')+'</details>':'')+'</div></article><div class="lessonfooter"><button class="text" data-action="previous">← Previous step</button><span>Step '+(index+1)+' of 4 · checkpoints are self-reported</span><button class="text" data-action="next">Next without marking done →</button></div>';}
function featureMap(){return '<div class="eyebrow">The product in plain English</div><h1>Which tool does what?</h1><p class="muted">Tap a feature for its role, boundary, and the step where you use it.</p><div class="featuregrid space">'+DATA.features.map((f,i)=>'<button data-feature="'+i+'"><span class="featureicon">'+f[4]+'</span><b>'+f[0]+'</b><small>'+f[1]+'</small></button>').join('')+'</div><div class="card space"><div class="eyebrow">After this week</div><h3>Add one capability at a time.</h3><p class="micro">Notebooks + Python → ingestion and pipelines → broader automation → certification practice. Keep one approved team pilot as your anchor.</p><div class="row space"><button data-action="bonus">Try a 15-minute notebook</button><a class="micro" href="'+OLD+'#reference" target="_blank" rel="noopener">Ingestion, AI and advanced reference ↗</a></div></div>';}
function dialog(title,body){if(!$('#dialog').open)focusBack=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal();$('#dialog').scrollTop=0;$('#close').focus();}
function closeDialog(){$('#dialog').close();focusBack?.focus();}
function settings(){dialog('Point the SQL at your sandbox','<p>Use names approved by your sandbox owner. These settings stay in this browser.</p><label class="field">Catalog<input id="catalog" value="'+esc(state.catalog)+'" placeholder="e.g. sandbox"><small>Copy the exact catalog name. No dots or spaces in this helper.</small></label><label class="field">Schema<input id="schema" value="'+esc(state.schema)+'"><small>Your personal schema, or an existing writable one supplied by the vendor.</small></label><label class="field">Your table prefix<input id="prefix" value="'+esc(state.prefix)+'"><small>Use a unique prefix if sharing a schema. Letters, numbers and underscores.</small></label><label class="checklabel"><input id="existing" type="checkbox" '+(state.existing?'checked':'')+'>Use an existing schema; skip CREATE SCHEMA</label><p class="micro muted">Changing names changes future SQL, not existing objects or checkmarks. Keep one namespace throughout the week.</p><div id="settings-error" class="feedback" role="status"></div><button class="primary" data-action="save-settings">Save sandbox names</button>');}
function accessRequest(){return 'I am learning in the vendor sandbox with synthetic data. Please confirm an approved Unity Catalog catalog and writable schema, plus CAN USE on a SQL warehouse. I need USE CATALOG, USE SCHEMA, and CREATE TABLE in that schema (also used to create views), with normal access to my own lab objects. If creating a schema, I also need CREATE SCHEMA on the catalog and configured managed storage. For the optional job exercise: SQL-task access, a pro/serverless warehouse, and permission for the run-as identity. I do not need production data, cloud credentials, or admin access.';}
function help(){const s=STEPS.find(s=>s.id===page);if(!s)return;dialog('Get past this step','<p>'+s.help+'</p><div class="notice">Use the same catalog, schema and prefix throughout. Read a query’s first error message before changing its SQL.</div><details class="space"><summary>What to ask the sandbox owner</summary><pre>'+esc(accessRequest())+'</pre><button class="small" data-action="copy-request">Copy request</button></details><label class="field space">If you cannot continue now<select id="block-reason"><option>Missing permission</option><option>No approved compute</option><option>Feature unavailable</option><option>Query or setup error</option></select></label><div class="row"><button class="primary" data-action="block">Mark blocked & continue</button><button data-action="close">Keep trying</button></div><p class="micro muted space">Blocked steps do not earn completion checkmarks.</p>');}
function travel(){dialog('Keep your progress','<p>Progress saves in this browser on this device. There is no automatic sync or account login. Clearing browser data or company cleanup policies can remove it.</p><div class="row"><button class="primary" data-action="export">Export this week</button><button data-action="import">Import a backup</button></div><p class="micro muted space">The older academy has separate progress, preserved in the <a href="'+OLD+'" target="_blank" rel="noopener">deep reference</a>. Export its portfolio there. This new checklist starts separately.</p><details class="space"><summary>Reset only this week’s checklist</summary><p>Export first. Older academy progress stays untouched.</p><button class="danger" data-action="reset">Reset this week</button></details>');}
function move(delta){const i=STEPS.findIndex(s=>s.id===page),target=STEPS[i+delta];go(target?target.id:'week');}
function correct(s,values){return s.check.every(([,expected],i)=>{const raw=String(values[i]??'').replace(/[,\s%]/g,'');return raw!==''&&Number.isFinite(Number(raw))&&Math.abs(Number(raw)-expected)<0.05;});}
function complete(){const s=STEPS.find(s=>s.id===page);if(!s)return;if(state.progress[s.id]==='done'){move(1);return;}const values=[...document.querySelectorAll('[data-answer]')].map(t=>t.value);state.answers[s.id]=values;if(s.check.length&&!correct(s,values)){$('#feedback').textContent='That does not match yet. Compare the expected result, table name and earlier steps; rerun the query if needed.';save();return;}state.progress[s.id]='done';delete state.reasons[s.id];save();const d=DAYS.find(d=>d.steps.some(t=>t.id===s.id));toast(dayDone(d)?'Day '+d.id+' cleared. You have a working result to keep.':'Checkpoint recorded.');move(1);}
function download(name,value,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([value],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied. Paste into the indicated Databricks editor.');}catch{dialog('Copy this text','<p>Clipboard access is unavailable. Select and copy this text manually.</p><pre>'+esc(text)+'</pre>');}}
function csvCell(x){return '"'+String(x).replace(/"/g,'""')+'"';}
function mapping(){if(!ready()){settings();return;}const row=[names().RAW.split(String.fromCharCode(96)).join('')+'.balance','Outstanding principal','Outstanding principal in USD for this exercise. Must be present and nonnegative.','Draft — owner review required','Synthetic training'];download('Week1_Collibra_Mapping_DRAFT.csv',[['technical_column','proposed_term','definition','approval_status','scope'],row].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');toast('Draft downloaded. Nothing was sent to Collibra.');}
function demo(){download('Week1_Team_Demo.md','# Three-minute sandbox demo\n\n1. Show 12 synthetic loans and the four explicit defects.\n2. Show the accepted and exception views.\n3. Explain 8 / 12 = 66.7%, including the rule scope.\n4. Find the description and trace the score through lineage, if captured.\n5. Show the dashboard and refresh; describe blocked features honestly.\n6. Explain why one bad update changed the live score before the snapshot.\n\n## One team pilot\nApproved dataset:\nBusiness-rule owner:\nThree checks to agree:\nException owner:\nMetadata / Collibra attribute owner:\nAcceptance check and refresh cadence:\n\nCheckpoints: '+done()+'/28. Blocked: '+blocked()+'.\nSelf-reported learning, not a certification assessment.\n','text/markdown');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go){go(d.go);return;}if(d.day){const day=DAYS.find(x=>x.id===Number(d.day));if(day)go((day.steps.find(s=>!state.progress[s.id])||day.steps[0]).id);return;}
 if(d.code){if(ready()||d.code==='connect')copy(sql(d.code));return;}if(d.downloadCode){if(ready()||d.downloadCode==='connect')download('Week1_'+d.downloadCode+'.sql',sql(d.downloadCode),'application/sql');return;}
 if(d.feature!==undefined){const f=DATA.features[Number(d.feature)];if(f)dialog(f[0],'<p><b>'+f[1]+'.</b> '+f[2]+'</p><button class="primary" data-feature-step="'+f[3]+'">Take me to the sandbox step →</button>');return;}
 if(d.featureStep){closeDialog();go(d.featureStep);return;}
 switch(d.action){
 case 'settings':settings();break;
 case 'save-settings':{const c=$('#catalog').value.trim(),s=$('#schema').value.trim(),p=$('#prefix').value.trim();if(!ID.test(c)||!ID.test(s)||!PREFIX.test(p)||['hive_metastore','system','samples'].includes(c.toLowerCase())){$('#settings-error').textContent='Choose a writable Unity Catalog catalog, not hive_metastore, system or samples. Names: letters, numbers, underscores or hyphens. Prefix: letters, numbers and underscores, starting with a letter.';return;}Object.assign(state,{catalog:c,schema:s,prefix:p,existing:$('#existing').checked});save();closeDialog();render();toast('Sandbox names saved. Your SQL now uses them.');break;}
 case 'complete':complete();break;case 'next':move(1);break;case 'previous':move(-1);break;
 case 'undo':delete state.progress[page];delete state.reasons[page];save();render();break;
 case 'help':help();break;case 'block':state.progress[page]='blocked';state.reasons[page]=$('#block-reason').value;save();closeDialog();move(1);break;
 case 'copy-request':copy(accessRequest());break;case 'mapping':mapping();break;case 'demo':demo();break;case 'travel':travel();break;
 case 'export':download('Databricks_Sandbox_Week_Progress.json',JSON.stringify({format:KEY,exportedAt:new Date().toISOString(),state},null,2),'application/json');toast('Backup prepared. Keep it somewhere approved for these settings.');break;
 case 'import':$('#import-file').click();break;case 'confirm-import':if(pendingImport){state=pendingImport;pendingImport=null;save();closeDialog();go('week');toast('Week checklist restored.');}break;
 case 'reset':dialog('Reset this week?','<p>This clears the seven-day checklist and sandbox names in this browser. Export a backup first if needed.</p><div class="row"><button data-action="export">Export first</button><button class="danger" data-action="confirm-reset">Reset checklist</button><button data-action="close">Cancel</button></div>');break;
 case 'confirm-reset':state=clean(null);save();closeDialog();go('week');break;case 'close':closeDialog();break;
 case 'bonus':dialog('Optional: a 15-minute notebook','<ol><li>Create a notebook from Workspace; choose SQL as its language.</li><li>Attach approved compatible compute. A pro or serverless SQL warehouse supports SQL notebook work when available.</li><li>Put your Day 2 profile into one cell and the grouped query into another.</li><li>Run cells separately. Add a short Markdown note explaining the result.</li></ol><p class="micro muted">This is an alternate work surface over the same data. Python can come next.</p><button data-feature-step="2-1">Get the profile SQL →</button>');break;
 }});
document.addEventListener('input',e=>{if(e.target.dataset.answer!==undefined){const s=STEPS.find(s=>s.id===page);if(!s)return;const a=state.answers[page]||(state.answers[page]=[]);a[Number(e.target.dataset.answer)]=e.target.value.slice(0,32);save();}});
document.addEventListener('change',async e=>{if(e.target.id!=='import-file')return;const f=e.target.files[0];if(!f)return;try{if(f.size>200000)throw Error();const x=JSON.parse(await f.text());if(x.format!==KEY)throw Error();pendingImport=clean(x.state);dialog('Replace this device’s week checklist?','<p>This replaces this week’s progress and sandbox names here. Export your current checklist first if needed.</p><div class="row"><button data-action="export">Export current</button><button class="primary" data-action="confirm-import">Import backup</button><button data-action="close">Cancel</button></div>');}catch{toast('Choose a backup from this seven-day guide. Older academy portfolios belong in the deep reference.');}e.target.value='';});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))closeDialog();});$('#dialog').addEventListener('cancel',()=>setTimeout(()=>focusBack?.focus(),0));
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||'week');
</script></body></html>
